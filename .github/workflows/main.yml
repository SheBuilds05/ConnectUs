name: Feature Branch CI

on:
  push:
    branches:
      - 'feature/*'
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  frontend-ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Check for Syntax Errors & Linting
        run: npm run lint
        working-directory: ./frontend

  backend-ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # REPLACEMENT FOR SERVICES: This works on Windows (the last code only works in ubuntu)
      - name: Setup PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@v8
        with:
          username: user
          password: password
          database: booking_db
          postgres-version: "15"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: ./backend

      - name: Run Backend Tests
        run: npm test
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://user:password@localhost:5432/booking_db  #replace this with our database url

 mobile-ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './mobile/package-lock.json'

      - name: Install Mobile Dependencies
        run: npm ci
        working-directory: ./mobile

      - name: Check Mobile Linting
        run: npm run lint
        working-directory: ./mobile

      
      - name: Build Android Debug (Check for errors)
        run: |
          cd android
          ./gradlew assembleDebug
        working-directory: ./mobile
